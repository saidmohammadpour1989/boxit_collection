<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه مدیریت جمع‌آوری باکسیت</title>

<style>
*{
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    margin:0;
    background:#f5f5f5;
    color:#333;
}

.header{
    background:#7b1538;
    color:white;
    padding:18px;
    text-align:center;
    box-shadow:0 2px 8px #aaa;
}

.header h1{
    margin:0;
    font-size:22px;
}

.header p{
    margin:8px 0 0;
    font-size:13px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 2px 8px #ddd;
}

.card h2{
    color:#7b1538;
    margin-top:0;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px;
}

.stat{
    background:#fafafa;
    border-right:5px solid #7b1538;
    padding:15px;
    border-radius:8px;
}

.stat strong{
    display:block;
    font-size:25px;
    color:#7b1538;
    margin-top:5px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

.table-wrap{
    overflow-x:auto;
}

th,td{
    border-bottom:1px solid #ddd;
    padding:11px 8px;
    text-align:center;
    font-size:13px;
}

th{
    background:#7b1538;
    color:white;
}

tr:hover{
    background:#fafafa;
}

.btn{
    border:none;
    border-radius:7px;
    padding:10px 15px;
    cursor:pointer;
    font-size:13px;
    margin:3px;
}

.btn-primary{
    background:#7b1538;
    color:white;
}

.btn-secondary{
    background:#eee;
    color:#333;
}

.btn-success{
    background:#2e7d32;
    color:white;
}

.btn-warning{
    background:#f0a000;
    color:white;
}

.btn-danger{
    background:#b3261e;
    color:white;
}

input,select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
    margin:6px 0 12px;
    background:white;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:12px;
}

.school-card{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-bottom:12px;
    background:#fff;
}

.school-card h3{
    color:#7b1538;
    margin-top:0;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:15px;
    font-size:11px;
    margin:2px;
}

.badge-green{
    background:#d9f2dc;
    color:#17651c;
}

.badge-red{
    background:#fde0df;
    color:#9b1c16;
}

.badge-orange{
    background:#fff0c9;
    color:#805900;
}

.info{
    background:#f8eef2;
    border-right:4px solid #7b1538;
    padding:12px;
    border-radius:6px;
    margin:10px 0;
}

.success-box{
    background:#e8f5e9;
    border-right:4px solid #2e7d32;
    padding:12px;
    border-radius:6px;
    margin:10px 0;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-content{
    background:white;
    border-radius:12px;
    padding:20px;
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
}

.close{
    float:left;
    font-size:25px;
    cursor:pointer;
    color:#777;
}

.logout{
    position:absolute;
    left:15px;
    top:15px;
    background:white;
    color:#7b1538;
    border:none;
    border-radius:7px;
    padding:8px 12px;
    cursor:pointer;
}

        font-size:18px;
    }

        padding:12px;

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOXIT | مدیریت جمع‌آوری آموزشگاه‌ها</title>

<style>
:root{
    --boxit:#7b1735;
    --boxit-dark:#5b1027;
    --boxit-light:#f7e9ee;
    --green:#198754;
    --orange:#e39a17;
    --red:#c62828;
    --gray:#f4f5f7;
    --text:#292929;
}

*{box-sizing:border-box}

body{
    margin:0;
    background:var(--gray);
    color:var(--text);
    font-family:Tahoma,Arial,sans-serif;
}

header{
    background:linear-gradient(135deg,var(--boxit-dark),var(--boxit));
    color:white;
    padding:18px;
    box-shadow:0 3px 12px #0002;
}

.header{
    max-width:1150px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    margin-top:5px;
    opacity:.85;
}

.container{
    width:94%;
    max-width:1150px;
    margin:20px auto;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
    overflow:auto;
}

.tabs button{
    border:1px solid #ddd;
    background:white;
    color:var(--boxit);
    padding:12px 18px;
    border-radius:10px;
    white-space:nowrap;
    cursor:pointer;
}

.tabs button.active{
    background:var(--boxit);
    color:white;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 3px 14px #0000000d;
}

.card h2,
.card h3{
    color:var(--boxit);
    margin-top:0;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    background:white;
    padding:18px;
    border-radius:14px;
    text-align:center;
    border-top:4px solid var(--boxit);
    box-shadow:0 3px 12px #0000000d;
}

.stat strong{
    display:block;
    font-size:28px;
    color:var(--boxit);
    margin-top:8px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.school{
    border:1px solid #e5e5e5;
    border-radius:13px;
    padding:16px;
    margin-bottom:12px;
}

.school-title{
    color:var(--boxit);
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:7px 0;
    border-bottom:1px solid #f0f0f0;
}

.row:last-child{
    border-bottom:none;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
}

.ready{background:#fff1ce;color:#765200}
.done{background:#dff4e7;color:#12683b}
.wait{background:#eee;color:#555}
.danger{background:#fde0e0;color:#a00000}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:9px;
    margin:6px 0 10px;
    font-size:15px;
}

button.action{
    width:100%;
    border:0;
    border-radius:9px;
    padding:12px;
    margin-top:7px;
    background:var(--boxit);
    color:white;
    font-size:14px;
    cursor:pointer;
}

button.green{background:var(--green)}
button.orange{background:var(--orange)}
button.gray{background:#666}
button.red{background:var(--red)}

.notice{
    padding:13px;
    border-radius:10px;
    margin:10px 0;
    line-height:1.9;
}

.notice.green{
    background:#e2f4e8;
    color:#16643a;
}

.notice.orange{
    background:#fff3d2;
    color:#755300;
}

.notice.red{
    background:#fde3e3;
    color:#9d0000;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
}

th{
    background:var(--boxit);
    color:white;
    padding:12px;
}

td{
    padding:11px;
    text-align:center;
    border-bottom:1px solid #eee;
}

td input{
    width:85px;
    margin:0;
}

.small{
    font-size:12px;
    color:#777;
}

.hidden{
    display:none!important;
}

.modal{
    position:fixed;
    inset:0;
    background:#0009;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:99;
}

.modal-box{
    background:white;
    width:100%;
    max-width:550px;
    max-height:90vh;
    overflow:auto;
    border-radius:16px;
    padding:20px;
}

.close{
    float:left;
    border:0;
    background:#eee;
    padding:8px 12px;
    border-radius:8px;
}

@media(max-width:750px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .grid{grid-template-columns:1fr}
    .header{flex-direction:column;text-align:center;gap:10px}
}
</style>
</head>

<body>

<header>
<div class="header">
    <div>
        <div class="logo">BOXIT</div>
        <div class="subtitle">سامانه مدیریت و جمع‌آوری آموزشگاه‌ها</div>
    </div>

    <div>
        کاربر: <strong id="currentUser">---</strong>
        <br>
        <span class="small" style="color:white">نسخه نمایشی</span>

<th>پرونده دریافتی</th>

<th>قبض ارسالی</th>
<th>قبض تح

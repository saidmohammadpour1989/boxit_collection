<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود - BOXIT</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f8;
    }

    .login-box {
      width: 92%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      color: #c00;
      min-height: 20px;
    }

    .test-info {
      margin-top: 20px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 10px;
      font-size: 13px;
      color: #666;
      text-align: right;
    }
  </style>
</head>

<body>

<div class="login-box">

  <h1>BOXIT</h1>

  <div class="subtitle">
    سامانه مدیریت و جمع‌آوری آموزشگاه‌ها
  </div>

  <input
    type="text"
    id="username"
    placeholder="نام کاربری"
    autocomplete="username"
  >

  <input
    type="password"
    id="password"
    placeholder="رمز عبور"
    autocomplete="current-password"
  >

  <button onclick="login()">
    ورود
  </button>

  <div id="message"></div>

  <div class="test-info">
    <strong>اطلاعات تست</strong><br><br>

    مدیر:
    admin / 123456
    <br>

    جمع‌آورنده:
    collector / 123456
    <br>

    آموزشگاه:
    school / 123456
  </div>

</div>


<script>

  const users = {

    admin: {
      password: "123456",
      role: "manager"
    },

    collector: {
      password: "123456",
      role: "collector"
    },

    school: {
      password: "123456",
      role: "school"
    }

  };


  function login() {

    const username =
      document.getElementById("username").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");


    if (!username || !password) {

      message.innerText =
        "لطفاً نام کاربری و رمز عبور را وارد کنید.";

      return;
    }


    const user = users[username];


    if (!user || user.password !== password) {

      message.innerText =
        "نام کاربری یا رمز عبور اشتباه است.";

      return;
    }


    localStorage.setItem(
      "boxitUser",
      username
    );


    window.location.href =
      "dashboard.html";

  }

</script>

</body>
</html>
